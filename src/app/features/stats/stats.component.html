<div class="page">
  <h1>Stats</h1>
  <p class="page-subtitle">Funnel, per-source performance, and generation cost.</p>

  <div class="toolbar">
    <mat-button-toggle-group
      [value]="period()"
      (change)="onPeriodChange($event.value)"
    >
      @for (p of periods; track p) {
        <mat-button-toggle [value]="p">{{ p }}</mat-button-toggle>
      }
    </mat-button-toggle-group>

    @if (loading()) {
      <mat-spinner diameter="24"></mat-spinner>
    }
  </div>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  @if (!errorMessage() && !loading()) {
    <section class="card elev-sm block">
      <div class="card-title">Funnel</div>
      <app-funnel-chart [points]="funnel()" />
    </section>

    <section class="card elev-sm block">
      <div class="card-title">Per source</div>
      <app-source-table [sources]="sources()" />
    </section>

    @if (costSummary(); as summary) {
      <section class="card elev-sm block">
        <div class="card-title">Cost</div>
        <app-cost-summary [summary]="summary" />
      </section>
    }
  }
</div>
