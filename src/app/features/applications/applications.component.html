<div class="page">
  @if (stats(); as s) {
    <div class="stats-bar">
      <div class="card elev-sm stat">
        <div class="card-title stat-value">{{ s.total }}</div>
        <div class="card-body stat-label">Total</div>
      </div>
      <div class="card elev-sm stat stat--unsent">
        <div class="card-title stat-value">{{ s.unsent }}</div>
        <div class="card-body stat-label">Unsent</div>
      </div>
      <div class="card elev-sm stat stat--filled">
        <div class="card-title stat-value">{{ s.filled }}</div>
        <div class="card-body stat-label">Filled</div>
      </div>
    </div>
  }

  <div class="toolbar">
    <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic" floatLabel="always">
      <mat-icon matPrefix>search</mat-icon>
      <input
        matInput
        [ngModel]="search()"
        (ngModelChange)="onSearchInput($event)"
        placeholder="Company, role, stack…"
        aria-label="Search applications"
      />
    </mat-form-field>

    <div class="filter-pills" role="group" aria-label="Sent filter">
      @for (option of statusOptions; track option) {
        <button
          type="button"
          class="filter-pill"
          [class.active]="statusFilter() === option"
          (click)="onStatusFilterChange(option)"
        >
          {{ option === 'all' ? 'All' : option === 'unsent' ? 'Unsent' : 'Filled' }}
        </button>
      }
    </div>

    @if (loading()) {
      <mat-spinner diameter="24"></mat-spinner>
    }

    <span class="toolbar-spacer"></span>

    <button
      type="button"
      class="btn btn-columns"
      [matMenuTriggerFor]="columnsMenu"
      aria-label="Choose visible columns"
    >
      <mat-icon>view_column</mat-icon>
      Columns
    </button>
    <mat-menu #columnsMenu="matMenu">
      @for (col of columnToggles; track col.colId) {
        <button
          mat-menu-item
          type="button"
          role="menuitemcheckbox"
          [attr.aria-checked]="isColumnVisible(col.colId)"
          (click)="$event.stopPropagation(); toggleColumn(col.colId)"
        >
          <mat-icon>{{ isColumnVisible(col.colId) ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
          <span>{{ col.label }}</span>
        </button>
      }
    </mat-menu>

    <button type="button" class="btn btn-new-app" (click)="openNewApplication()">
      + New application
    </button>
  </div>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <ag-grid-angular
    class="ag-theme-material applications-grid"
    [theme]="'legacy'"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    rowModelType="infinite"
    [cacheBlockSize]="limit()"
    [pagination]="true"
    [paginationPageSize]="limit()"
    [paginationPageSizeSelector]="[25, 50, 100]"
    (gridReady)="onGridReady($event)"
    (cellValueChanged)="onCellValueChanged($event)"
  />
</div>
