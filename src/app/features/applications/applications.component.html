<div class="page">
  @if (stats(); as s) {
    <div class="stats-bar">
      <div class="stat"><span class="stat-value">{{ s.total }}</span><span class="stat-label">Total</span></div>
      <div class="stat"><span class="stat-value">{{ s.unsent }}</span><span class="stat-label">Unsent</span></div>
      <div class="stat"><span class="stat-value">{{ s.filled }}</span><span class="stat-label">Filled</span></div>
    </div>
  }

  <div class="toolbar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search</mat-label>
      <input
        matInput
        [ngModel]="search()"
        (ngModelChange)="onSearchInput($event)"
        placeholder="Company or title"
      />
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="status-field">
      <mat-label>Status</mat-label>
      <mat-select [ngModel]="statusFilter()" (ngModelChange)="onStatusFilterChange($event)">
        @for (option of statusOptions; track option) {
          <mat-option [value]="option">{{ option === 'all' ? 'All' : option === 'unsent' ? 'Unsent' : 'Filled' }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    @if (loading()) {
      <mat-spinner diameter="24"></mat-spinner>
    }
  </div>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <ag-grid-angular
    class="ag-theme-material applications-grid"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    rowModelType="infinite"
    [cacheBlockSize]="limit()"
    [pagination]="true"
    [paginationPageSize]="limit()"
    [paginationPageSizeSelector]="[25, 50, 100]"
    (gridReady)="onGridReady($event)"
    (cellValueChanged)="onCellValueChanged($event)"
  />
</div>
