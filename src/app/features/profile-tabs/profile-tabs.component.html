<div class="page">
  <nav class="filter-pills profile-tab-strip" role="tablist" aria-label="Profile sections">
    @for (tab of visibleTabs(); track tab.key) {
      <button
        type="button"
        class="filter-pill"
        role="tab"
        [class.active]="activeTab() === tab.key"
        [attr.aria-selected]="activeTab() === tab.key"
        (click)="selectTab(tab.key)"
      >
        {{ tab.label }}
      </button>
    }
  </nav>

  <div class="tab-content">
    @switch (activeTab()) {
      @case ('uploads') {
        <app-profile-uploads (completed)="selectTab('editor')" />
      }
      @case ('editor') {
        <app-profile-editor />
      }
      @case ('files') {
        <app-profile-rendered-files />
      }
      @case ('preview') {
        <app-profile-test-resume />
      }
    }
  </div>
</div>
